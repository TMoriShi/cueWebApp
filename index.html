<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>cueWebApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea, select {
      user-select: text;
    }
    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top, 0px);
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    .touch-press:active {
      transform: scale(0.97);
      transition: transform 0.08s ease;
    }
    .active-tile {
      background: #0284c7 !important;
      border-color: #38bdf8 !important;
      color: #ffffff !important;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen md:h-screen md:overflow-hidden flex flex-col selection:bg-cyan-500 selection:text-slate-950 pb-24 md:pb-0">

  <!-- ヘッダー (画面全幅) -->
  <header class="border-b border-slate-800 bg-slate-900/95 sticky top-0 z-40 px-4 md:px-8 py-3 pt-safe flex items-center justify-between shrink-0 shadow-sm">
    <div class="flex items-center space-x-3">
      <span class="text-base md:text-xl font-black text-white tracking-tight">cueWebApp</span>
      <span id="autoSaveIndicator" class="text-[11px] font-mono-num text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-800/50 hidden sm:inline-block">● 自動保存</span>
    </div>

    <!-- モード切り替え & JSON -->
    <div class="flex items-center gap-2 md:gap-3">
      <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs md:text-sm">
        <button id="btnModePlay" class="touch-press px-4 py-1.5 rounded-lg font-bold transition bg-cyan-600 text-white shadow-sm">演奏</button>
        <button id="btnModeEdit" class="touch-press px-4 py-1.5 rounded-lg font-semibold transition text-slate-400 hover:text-slate-200">編集</button>
        <button id="btnModeFiles" class="touch-press px-4 py-1.5 rounded-lg font-semibold transition text-slate-400 hover:text-slate-200">ファイル</button>
      </div>

      <div class="h-5 w-px bg-slate-800 mx-1 hidden sm:block"></div>

      <label class="cursor-pointer text-xs md:text-sm px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 border border-slate-700 transition flex items-center gap-1.5 shrink-0" title="JSONインポート">
        <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
        </svg>
        <span class="font-medium hidden sm:inline">JSONインポート</span>
        <input type="file" id="jsonFileInput" accept=".json" class="hidden">
      </label>

      <button id="downloadJsonBtn" class="text-xs md:text-sm px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 border border-slate-700 transition flex items-center gap-1.5 shrink-0" title="JSONエクスポート">
        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        <span class="font-medium hidden sm:inline">JSONエクスポート</span>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 w-full p-3 sm:p-5 md:p-6 flex flex-col gap-3 md:gap-4 md:overflow-hidden">

    <!-- 上部: 音源ファイル情報バー -->
    <div id="dropZone" class="relative rounded-xl border border-dashed border-slate-800 hover:border-cyan-500 bg-slate-900/40 p-2.5 md:p-3 transition cursor-pointer shrink-0">
      <input type="file" id="audioFileInput" accept="audio/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
      
      <div id="uploadPrompt" class="flex items-center justify-center gap-2 py-0.5 text-center">
        <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
        </svg>
        <span class="text-xs md:text-sm font-semibold text-slate-300">音源を選択 または ドラッグ＆ドロップ (MP3 / WAV)</span>
      </div>

      <div id="fileLoadedInfo" class="hidden flex items-center justify-between">
        <div class="flex items-center gap-2.5 min-w-0">
          <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 shrink-0"></span>
          <p id="loadedFileName" class="text-xs md:text-sm font-bold text-slate-100 truncate font-mono-num">audio.mp3</p>
        </div>
        <button id="changeFileBtn" class="text-xs px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 relative z-20 border border-slate-700">音源変更</button>
      </div>
    </div>

    <!-- プレイヤー & 巨大ワイド波形セクション -->
    <div class="rounded-2xl border border-slate-800 bg-slate-900/90 p-3 sm:p-4 md:p-5 shadow-sm flex flex-col gap-3 shrink-0">
      
      <!-- スマホ用助走再生バー (md未満で表示) -->
      <div class="flex md:hidden items-center justify-between bg-slate-950 p-1.5 rounded-xl border border-slate-800">
        <button id="btnMobilePrerollToggle" class="touch-press px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-slate-800 text-slate-400 border border-slate-700">
          <span id="mobilePrerollDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
          <span>助走再生</span>
        </button>
        <div class="flex items-center gap-1 text-xs">
          <span class="text-slate-400 text-[11px]">助走:</span>
          <select id="mobilePrerollSecSelect" class="bg-slate-900 border border-slate-700 rounded px-1.5 py-0.5 text-cyan-300 font-mono-num font-bold focus:outline-none">
            <option value="1">1秒</option>
            <option value="2" selected>2秒</option>
            <option value="3">3秒</option>
            <option value="4">4秒</option>
            <option value="5">5秒</option>
          </select>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="text-xs md:text-sm font-black text-slate-400 uppercase bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800">CURRENT</span>
          <span id="activeMarkerLabel" class="text-xl md:text-3xl font-black text-cyan-400 font-mono-num tracking-wide">--</span>
        </div>

        <!-- コントロールボタン群 (PC画面: 波形の真上) -->
        <div class="hidden md:flex items-center gap-3">
          <!-- PC用 助走再生 (プレロール) コントロール -->
          <div class="flex items-center gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800 mr-2">
            <button id="btnPcPrerollToggle" class="touch-press px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-slate-800 text-slate-400 border border-slate-700">
              <span id="pcPrerollDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
              <span>助走再生</span>
            </button>
            <select id="pcPrerollSecSelect" class="bg-transparent text-cyan-300 font-mono-num font-bold text-xs px-2 py-1 focus:outline-none cursor-pointer">
              <option value="1" class="bg-slate-900 text-white">1秒</option>
              <option value="2" selected class="bg-slate-900 text-white">2秒</option>
              <option value="3" class="bg-slate-900 text-white">3秒</option>
              <option value="4" class="bg-slate-900 text-white">4秒</option>
              <option value="5" class="bg-slate-900 text-white">5秒</option>
            </select>
          </div>

          <button id="btnPcRewind" class="touch-press px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 font-mono-num font-bold text-sm text-slate-200 shadow-sm">-5s</button>
          
          <button id="btnPcPlayPause" class="touch-press px-6 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black text-sm shadow flex items-center gap-2">
            <svg id="pcPlayIcon" class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
            <svg id="pcPauseIcon" class="w-4 h-4 fill-current hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" /></svg>
            <span id="btnPcPlayText">再生</span>
          </button>
          
          <button id="btnPcForward" class="touch-press px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 font-mono-num font-bold text-sm text-slate-200 shadow-sm">+5s</button>
          
          <button id="btnPcAddMarker" class="touch-press px-5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-sm shadow flex items-center gap-1.5 ml-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" /></svg>
            <span>マーカー追加 (M)</span>
          </button>
        </div>

        <div class="flex items-baseline gap-2 font-mono-num">
          <span id="currentTimeDisplay" class="text-2xl md:text-4xl font-black tracking-tight text-white">00:00.000</span>
          <span class="text-slate-600 text-sm">/</span>
          <span id="totalDurationDisplay" class="text-sm md:text-base text-slate-400">00:00.000</span>
        </div>
      </div>

      <!-- 横いっぱいに広がる超大型波形 -->
      <div class="relative w-full h-20 md:h-36 bg-slate-950 rounded-xl overflow-hidden border border-slate-800 cursor-pointer select-none touch-none" id="waveformContainer">
        <canvas id="waveformCanvas" class="w-full h-full block"></canvas>
        <div id="playhead" class="absolute top-0 bottom-0 w-[2px] bg-cyan-400 pointer-events-none z-20 -translate-x-1/2 shadow-[0_0_12px_#22d3ee]" style="left: 0%;"></div>
        <div id="markerPinsOverlay" class="absolute inset-0 pointer-events-none z-10 overflow-hidden"></div>
      </div>
    </div>

    <!-- 下部: モード別表示エリア -->
    <div class="flex-1 min-h-0 flex flex-col md:overflow-hidden">

      <!-- VIEW 1: 演奏モード -->
      <div id="playView" class="flex-1 flex flex-col gap-2 md:overflow-hidden">
        <div class="flex items-center justify-between px-1">
          <span class="text-xs md:text-sm font-bold text-slate-400 uppercase tracking-wider">CUE PADS (クリックで即座に頭出し)</span>
          <span class="text-xs text-slate-500 font-mono-num" id="playMarkerCount">0 個のキュー</span>
        </div>
        <div class="flex-1 md:overflow-y-auto pr-1">
          <div id="playTilesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-8 gap-3 md:gap-4 pb-4">
            <div id="emptyPlayMsg" class="col-span-full py-20 text-center text-slate-500 text-sm rounded-2xl border border-dashed border-slate-800/80 bg-slate-900/40">
              マーカーがありません。「編集」タブで曲を聴きながら [M] キーで打刻してください。
            </div>
          </div>
        </div>
      </div>

      <!-- VIEW 2: 編集モード -->
      <div id="editView" class="hidden flex-1 flex flex-col gap-2 md:overflow-hidden">
        <div class="flex items-center justify-between px-1">
          <span class="text-xs md:text-sm font-bold text-slate-400">登録マーカー (<span id="markerCountBadge">0</span>)</span>
          <div class="flex items-center gap-2">
            <button id="sortMarkersBtn" class="touch-press text-xs md:text-sm px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">時間順に整列</button>
            <button id="clearAllMarkersBtn" class="touch-press text-xs md:text-sm px-3 py-1.5 rounded-lg bg-rose-950/40 hover:bg-rose-900/50 text-rose-300 border border-rose-800/40">全消去</button>
          </div>
        </div>

        <div class="flex-1 md:overflow-y-auto pr-1 pb-4">
          <div id="markersList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-2.5">
            <div id="emptyMarkersMsg" class="col-span-full py-20 text-center text-slate-500 text-sm rounded-2xl border border-dashed border-slate-800/80 bg-slate-900/40">
              マーカーがありません。「マーカー追加」ボタンまたは [M] キーで打刻してください。
            </div>
          </div>
        </div>
      </div>

      <!-- VIEW 3: ファイル管理モード -->
      <div id="filesView" class="hidden flex-1 flex flex-col gap-3 md:overflow-hidden">
        <div class="flex items-center justify-between px-1">
          <span class="text-xs md:text-sm font-semibold text-slate-400">ブラウザ保存済み一覧 (<span id="savedCountBadge">0</span>)</span>
        </div>

        <div class="flex-1 md:overflow-y-auto pr-1 pb-4">
          <div id="savedProjectsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
            <div id="emptyFilesMsg" class="col-span-full py-20 text-center text-slate-500 text-sm rounded-2xl border border-dashed border-slate-800/80 bg-slate-900/40">
              保存されたプロジェクトはありません。
            </div>
          </div>
        </div>
      </div>

    </div>

  </main>

  <!-- スマホ専用 ボトムコントローラー (md以上では非表示) -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur border-t border-slate-800 px-4 py-2.5 pb-safe md:hidden shadow-lg">
    <div class="max-w-md mx-auto flex items-center gap-2">
      <button id="btnRewind5s" class="touch-press w-12 h-12 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 flex items-center justify-center shrink-0">
        <span class="text-xs font-mono-num font-bold">-5s</span>
      </button>

      <button id="btnPlayPause" class="touch-press w-14 h-12 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 flex items-center justify-center shrink-0 shadow font-bold">
        <svg id="playIcon" class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
        <svg id="pauseIcon" class="w-6 h-6 fill-current hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" /></svg>
      </button>

      <button id="btnForward5s" class="touch-press w-12 h-12 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 flex items-center justify-center shrink-0">
        <span class="text-xs font-mono-num font-bold">+5s</span>
      </button>

      <button id="btnAddMarkerBtn" class="touch-press flex-1 h-12 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold flex items-center justify-center gap-1.5 px-3 shadow text-xs">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" /></svg>
        <span>追加 (M)</span>
      </button>
    </div>
  </nav>

  <!-- トースト -->
  <div id="toast" class="fixed top-14 left-1/2 -translate-x-1/2 bg-slate-800/95 text-cyan-300 border border-cyan-500/40 px-4 py-2 rounded-xl shadow-xl opacity-0 pointer-events-none transition duration-150 z-50 text-xs md:text-sm font-medium">
    <span id="toastMsg">通知</span>
  </div>

  <audio id="audioElement" preload="metadata"></audio>

  <script>
    const state = {
      mode: 'play',
      audioBuffer: null,
      audioDuration: 0,
      audioFileName: '',
      audioBlob: null,
      markers: [],
      nextLabelIndex: 0,
      currentMarkerIndex: -1,
      prerollEnabled: false,
      prerollSec: 2.0,
      isCountdown: false // 冒頭待機カウントダウン中か
    };

    let audioCtx = null;
    let isScrubbing = false;
    let countdownTimer = null;

    // DOM参照
    const audioElement = document.getElementById('audioElement');
    const audioFileInput = document.getElementById('audioFileInput');
    const dropZone = document.getElementById('dropZone');
    const uploadPrompt = document.getElementById('uploadPrompt');
    const fileLoadedInfo = document.getElementById('fileLoadedInfo');
    const loadedFileName = document.getElementById('loadedFileName');
    const changeFileBtn = document.getElementById('changeFileBtn');

    const currentTimeDisplay = document.getElementById('currentTimeDisplay');
    const totalDurationDisplay = document.getElementById('totalDurationDisplay');
    const activeMarkerLabel = document.getElementById('activeMarkerLabel');
    const markerCountBadge = document.getElementById('markerCountBadge');
    const playMarkerCount = document.getElementById('playMarkerCount');
    const savedCountBadge = document.getElementById('savedCountBadge');

    const waveformCanvas = document.getElementById('waveformCanvas');
    const waveformContainer = document.getElementById('waveformContainer');
    const playhead = document.getElementById('playhead');
    const markerPinsOverlay = document.getElementById('markerPinsOverlay');

    // 助走再生 UI
    const btnPcPrerollToggle = document.getElementById('btnPcPrerollToggle');
    const pcPrerollDot = document.getElementById('pcPrerollDot');
    const pcPrerollSecSelect = document.getElementById('pcPrerollSecSelect');
    const btnMobilePrerollToggle = document.getElementById('btnMobilePrerollToggle');
    const mobilePrerollDot = document.getElementById('mobilePrerollDot');
    const mobilePrerollSecSelect = document.getElementById('mobilePrerollSecSelect');

    // コントローラー (スマホ/PC)
    const btnPlayPause = document.getElementById('btnPlayPause');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const btnRewind5s = document.getElementById('btnRewind5s');
    const btnForward5s = document.getElementById('btnForward5s');
    const btnAddMarkerBtn = document.getElementById('btnAddMarkerBtn');

    const btnPcPlayPause = document.getElementById('btnPcPlayPause');
    const pcPlayIcon = document.getElementById('pcPlayIcon');
    const pcPauseIcon = document.getElementById('pcPauseIcon');
    const btnPcPlayText = document.getElementById('btnPcPlayText');
    const btnPcRewind = document.getElementById('btnPcRewind');
    const btnPcForward = document.getElementById('btnPcForward');
    const btnPcAddMarker = document.getElementById('btnPcAddMarker');

    const btnModePlay = document.getElementById('btnModePlay');
    const btnModeEdit = document.getElementById('btnModeEdit');
    const btnModeFiles = document.getElementById('btnModeFiles');
    const playView = document.getElementById('playView');
    const editView = document.getElementById('editView');
    const filesView = document.getElementById('filesView');
    const playTilesGrid = document.getElementById('playTilesGrid');
    const emptyPlayMsg = document.getElementById('emptyPlayMsg');

    const markersList = document.getElementById('markersList');
    const emptyMarkersMsg = document.getElementById('emptyMarkersMsg');
    const sortMarkersBtn = document.getElementById('sortMarkersBtn');
    const clearAllMarkersBtn = document.getElementById('clearAllMarkersBtn');

    const savedProjectsList = document.getElementById('savedProjectsList');
    const emptyFilesMsg = document.getElementById('emptyFilesMsg');

    const downloadJsonBtn = document.getElementById('downloadJsonBtn');
    const jsonFileInput = document.getElementById('jsonFileInput');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');

    // ==========================================
    // 助走再生 (プレロール) コントロール
    // ==========================================
    function updatePrerollUI() {
      const activeClass = ['bg-emerald-950/60', 'text-emerald-300', 'border-emerald-700/60'];
      const inactiveClass = ['bg-slate-800', 'text-slate-400', 'border-slate-700'];

      if (state.prerollEnabled) {
        [btnPcPrerollToggle, btnMobilePrerollToggle].forEach(btn => {
          btn.classList.remove(...inactiveClass);
          btn.classList.add(...activeClass);
        });
        [pcPrerollDot, mobilePrerollDot].forEach(dot => {
          dot.classList.remove('bg-slate-500');
          dot.classList.add('bg-emerald-400');
        });
      } else {
        [btnPcPrerollToggle, btnMobilePrerollToggle].forEach(btn => {
          btn.classList.remove(...activeClass);
          btn.classList.add(...inactiveClass);
        });
        [pcPrerollDot, mobilePrerollDot].forEach(dot => {
          dot.classList.remove('bg-emerald-400');
          dot.classList.add('bg-slate-500');
        });
      }

      pcPrerollSecSelect.value = String(state.prerollSec);
      mobilePrerollSecSelect.value = String(state.prerollSec);
    }

    function togglePreroll() {
      state.prerollEnabled = !state.prerollEnabled;
      updatePrerollUI();
      triggerAutoSave();
      showToast(state.prerollEnabled ? `助走再生 ON: ${state.prerollSec}秒手前・冒頭待機` : '助走再生 OFF');
    }

    btnPcPrerollToggle.addEventListener('click', togglePreroll);
    btnMobilePrerollToggle.addEventListener('click', togglePreroll);

    function onPrerollSecChange(e) {
      state.prerollSec = parseFloat(e.target.value) || 2.0;
      updatePrerollUI();
      triggerAutoSave();
      if (state.prerollEnabled) {
        showToast(`助走秒数を ${state.prerollSec} 秒に変更しました`);
      }
    }

    pcPrerollSecSelect.addEventListener('change', onPrerollSecChange);
    mobilePrerollSecSelect.addEventListener('change', onPrerollSecChange);

    // ==========================================
    // 冒頭待機カウントダウン & 再生ロジック
    // ==========================================
    function cancelCountdown() {
      if (countdownTimer) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }
      state.isCountdown = false;
      currentTimeDisplay.classList.remove('text-amber-400');
    }

    function startPlaybackWithPrerollCheck(targetSec) {
      cancelCountdown();

      if (!audioElement.src) {
        showToast('音源を選択してください');
        return;
      }

      // 助走再生がONで、かつ再生位置が助走秒数未満（0秒付近）の場合
      if (state.prerollEnabled && targetSec < state.prerollSec) {
        audioElement.pause();
        audioElement.currentTime = 0;
        updateProgress();

        state.isCountdown = true;
        setPlaybackUI(true);

        const totalWaitMs = Math.round(state.prerollSec * 1000);
        const startTime = Date.now();

        currentTimeDisplay.classList.add('text-amber-400');
        showToast(`再生まで ${state.prerollSec} 秒待機中...`);

        countdownTimer = setInterval(() => {
          const elapsed = Date.now() - startTime;
          const remaining = Math.max(0, (totalWaitMs - elapsed) / 1000);

          currentTimeDisplay.textContent = `WAIT 0${remaining.toFixed(1)}s`;

          if (elapsed >= totalWaitMs) {
            cancelCountdown();
            currentTimeDisplay.textContent = formatTime(0);
            audioElement.play().then(() => setPlaybackUI(true)).catch(err => console.warn(err));
          }
        }, 50);
      } else {
        // 通常の助走または助走OFF
        const actualStartSec = (state.prerollEnabled && targetSec >= state.prerollSec)
          ? targetSec - state.prerollSec
          : targetSec;

        audioElement.currentTime = actualStartSec;
        audioElement.play().then(() => setPlaybackUI(true)).catch(err => console.warn(err));
        updateProgress();
      }
    }

    function togglePlayPause() {
      if (!audioElement.src) {
        showToast('音源を選択してください');
        return;
      }

      // カウントダウン中の場合はキャンセル
      if (state.isCountdown) {
        cancelCountdown();
        setPlaybackUI(false);
        currentTimeDisplay.textContent = formatTime(audioElement.currentTime);
        showToast('待機をキャンセルしました');
        return;
      }

      if (audioElement.paused) {
        // 一時停止状態から再開する場合
        startPlaybackWithPrerollCheck(audioElement.currentTime);
      } else {
        audioElement.pause();
        setPlaybackUI(false);
      }
    }

    btnPlayPause.addEventListener('click', togglePlayPause);
    btnPcPlayPause.addEventListener('click', togglePlayPause);

    // ==========================================
    // IndexedDB 自動保存システム
    // ==========================================
    const DB_NAME = 'CueWebAppDB_v3';
    const DB_VERSION = 1;
    const STORE_NAME = 'saved_songs';
    const LAST_OPENED_KEY = 'last_opened_project_id';

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    let autoSaveTimeout = null;
    function triggerAutoSave() {
      if (!state.audioBlob || !state.audioFileName) return;
      clearTimeout(autoSaveTimeout);
      autoSaveTimeout = setTimeout(async () => {
        try {
          const db = await initDB();
          const projId = 'proj_' + state.audioFileName.replace(/\s+/g, '_');
          const project = {
            id: projId,
            title: state.audioFileName,
            audioBlob: state.audioBlob,
            markers: state.markers,
            prerollEnabled: state.prerollEnabled,
            prerollSec: state.prerollSec,
            updatedAt: Date.now()
          };
          const tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).put(project);
          tx.oncomplete = () => {
            localStorage.setItem(LAST_OPENED_KEY, projId);
            loadSavedProjectsList();
          };
        } catch (e) {
          console.warn('AutoSave error:', e);
        }
      }, 400);
    }

    async function loadSavedProjectsList() {
      const db = await initDB();
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).getAll();
      req.onsuccess = () => {
        const list = req.result || [];
        savedCountBadge.textContent = list.length;
        renderSavedProjectsList(list);
      };
    }

    async function loadProjectFromDB(id) {
      const db = await initDB();
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(id);
      req.onsuccess = async () => {
        const p = req.result;
        if (!p) return;
        state.audioBlob = p.audioBlob;
        state.markers = p.markers || [];
        state.markers.sort((a, b) => a.timeMs - b.timeMs);
        state.nextLabelIndex = state.markers.length;
        if (p.prerollEnabled !== undefined) state.prerollEnabled = p.prerollEnabled;
        if (p.prerollSec !== undefined) state.prerollSec = p.prerollSec;
        updatePrerollUI();

        localStorage.setItem(LAST_OPENED_KEY, p.id);
        
        await loadAudioFile(new File([p.audioBlob], `${p.title}.mp3`, { type: p.audioBlob.type }), false);
        setMode('play');
        showToast(`「${p.title}」を読み込みました`);
      };
    }

    async function deleteProjectFromDB(id) {
      const db = await initDB();
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).delete(id);
      tx.oncomplete = () => {
        if (localStorage.getItem(LAST_OPENED_KEY) === id) {
          localStorage.removeItem(LAST_OPENED_KEY);
        }
        showToast('削除しました');
        loadSavedProjectsList();
      };
    }

    function renderSavedProjectsList(projects) {
      if (projects.length === 0) {
        emptyFilesMsg.classList.remove('hidden');
        savedProjectsList.innerHTML = '';
        savedProjectsList.appendChild(emptyFilesMsg);
        return;
      }
      emptyFilesMsg.classList.add('hidden');
      savedProjectsList.innerHTML = '';

      projects.sort((a, b) => b.updatedAt - a.updatedAt).forEach(proj => {
        const item = document.createElement('div');
        item.className = 'rounded-2xl border border-slate-800 bg-slate-900/90 p-4 flex items-center justify-between gap-3 shadow-sm';
        const dateStr = new Date(proj.updatedAt).toLocaleDateString('ja-JP', {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        item.innerHTML = `
          <div class="min-w-0 flex-1">
            <h3 class="text-sm font-bold text-white truncate font-mono-num">${escapeHtml(proj.title)}</h3>
            <p class="text-xs text-slate-400 mt-1">マーカー ${proj.markers ? proj.markers.length : 0} 個 ・ ${dateStr}</p>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <button data-id="${proj.id}" class="btn-load-proj touch-press px-4 py-2 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs md:text-sm shadow-sm">
              開く
            </button>
            <button data-id="${proj.id}" class="btn-del-proj touch-press p-2 rounded-xl bg-slate-800 hover:bg-rose-900/50 text-slate-400 hover:text-rose-300">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>
        `;
        savedProjectsList.appendChild(item);
      });

      savedProjectsList.querySelectorAll('.btn-load-proj').forEach(b => {
        b.addEventListener('click', () => loadProjectFromDB(b.getAttribute('data-id')));
      });
      savedProjectsList.querySelectorAll('.btn-del-proj').forEach(b => {
        b.addEventListener('click', () => deleteProjectFromDB(b.getAttribute('data-id')));
      });
    }

    // ==========================================
    // モード切り替えロジック
    // ==========================================
    function setMode(mode) {
      state.mode = mode;
      [playView, editView, filesView].forEach(v => v.classList.add('hidden'));
      [btnModePlay, btnModeEdit, btnModeFiles].forEach(b => {
        b.className = 'touch-press px-4 py-1.5 rounded-lg font-semibold transition text-slate-400 hover:text-slate-200';
      });

      if (mode === 'play') {
        playView.classList.remove('hidden');
        btnModePlay.className = 'touch-press px-4 py-1.5 rounded-lg font-bold transition bg-cyan-600 text-white shadow-sm';
        renderPlayTiles();
      } else if (mode === 'edit') {
        editView.classList.remove('hidden');
        btnModeEdit.className = 'touch-press px-4 py-1.5 rounded-lg font-bold transition bg-cyan-600 text-white shadow-sm';
        renderMarkersList();
      } else if (mode === 'files') {
        filesView.classList.remove('hidden');
        btnModeFiles.className = 'touch-press px-4 py-1.5 rounded-lg font-bold transition bg-cyan-600 text-white shadow-sm';
        loadSavedProjectsList();
      }
    }

    btnModePlay.addEventListener('click', () => setMode('play'));
    btnModeEdit.addEventListener('click', () => setMode('edit'));
    btnModeFiles.addEventListener('click', () => setMode('files'));

    // ==========================================
    // オーディオ & 波形処理
    // ==========================================
    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) seconds = 0;
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      const ms = Math.floor((seconds % 1) * 1000);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(ms).padStart(3, '0')}`;
    }

    function formatTimeMs(ms) {
      return formatTime(ms / 1000);
    }

    function showToast(text) {
      toastMsg.textContent = text;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 1500);
    }

    function getNextDefaultLabel(index) {
      if (index === 0) return 'Intro';
      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const letterIdx = index - 1;
      if (letterIdx < letters.length) return letters[letterIdx];
      return letters[letterIdx % 26] + Math.floor(letterIdx / 26);
    }

    function getAccurateDuration() {
      return state.audioDuration || audioElement.duration || 0;
    }

    async function loadAudioFile(file, autoTriggerSave = true) {
      if (!file) return;
      state.audioBlob = file;
      state.audioFileName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
      loadedFileName.textContent = file.name;
      
      uploadPrompt.classList.add('hidden');
      fileLoadedInfo.classList.remove('hidden');

      audioElement.src = URL.createObjectURL(file);

      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }
        const arrayBuffer = await file.arrayBuffer();
        state.audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        state.audioDuration = state.audioBuffer.duration;
        totalDurationDisplay.textContent = formatTime(state.audioDuration);
        drawWaveform();
        renderMarkerPins();
        renderPlayTiles();
        renderMarkersList();
        if (autoTriggerSave) triggerAutoSave();
        showToast('音源を読み込みました');
      } catch (err) {
        console.warn('波形エラー:', err);
      }
    }

    audioFileInput.addEventListener('change', (e) => {
      if (e.target.files[0]) loadAudioFile(e.target.files[0]);
    });

    changeFileBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      audioFileInput.click();
    });

    ['dragenter', 'dragover'].forEach(ev => {
      dropZone.addEventListener(ev, (e) => {
        e.preventDefault();
        dropZone.classList.add('border-cyan-400');
      });
    });
    ['dragleave', 'drop'].forEach(ev => {
      dropZone.addEventListener(ev, (e) => {
        e.preventDefault();
        dropZone.classList.remove('border-cyan-400');
      });
    });
    dropZone.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('audio/')) loadAudioFile(file);
    });

    function drawWaveform() {
      if (!state.audioBuffer) return;
      const dpr = window.devicePixelRatio || 1;
      const rect = waveformContainer.getBoundingClientRect();
      if (rect.width === 0) return;

      waveformCanvas.width = rect.width * dpr;
      waveformCanvas.height = rect.height * dpr;

      const ctx = waveformCanvas.getContext('2d');
      ctx.scale(dpr, dpr);

      const width = rect.width;
      const height = rect.height;
      const data = state.audioBuffer.getChannelData(0);
      const step = Math.ceil(data.length / width);
      const amp = height / 2;

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#0284c7';

      for (let i = 0; i < width; i++) {
        let min = 1.0;
        let max = -1.0;
        for (let j = 0; j < step; j++) {
          const val = data[(i * step) + j];
          if (val < min) min = val;
          if (val > max) max = val;
        }
        ctx.fillRect(i, (1 + min) * amp, 1, Math.max(1, (max - min) * amp));
      }
    }

    window.addEventListener('resize', () => {
      if (state.audioBuffer) {
        drawWaveform();
        renderMarkerPins();
      }
    });

    function renderMarkerPins() {
      markerPinsOverlay.innerHTML = '';
      const totalSec = getAccurateDuration();
      if (!totalSec) return;

      state.markers.forEach(m => {
        const pct = ((m.timeMs / 1000) / totalSec) * 100;
        if (pct < 0 || pct > 100) return;

        const pin = document.createElement('div');
        pin.className = 'absolute top-0 bottom-0 pointer-events-none -translate-x-1/2 flex flex-col items-center';
        pin.style.left = `${pct}%`;
        pin.innerHTML = `
          <div class="px-2 py-0.5 rounded bg-amber-400 text-slate-950 font-black text-[10px] md:text-xs font-mono-num leading-tight shadow">
            ${escapeHtml(m.label)}
          </div>
          <div class="w-px h-full bg-amber-400/80"></div>
        `;
        markerPinsOverlay.appendChild(pin);
      });
    }

    function setPlaybackUI(isPlaying) {
      if (isPlaying) {
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
        pcPlayIcon.classList.add('hidden');
        pcPauseIcon.classList.remove('hidden');
        btnPcPlayText.textContent = '停止';
      } else {
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
        pcPlayIcon.classList.remove('hidden');
        pcPauseIcon.classList.add('hidden');
        btnPcPlayText.textContent = '再生';
      }
    }

    function seekRelative(seconds) {
      if (!audioElement.src) return;
      cancelCountdown();
      const totalSec = getAccurateDuration();
      const target = Math.max(0, Math.min(totalSec, audioElement.currentTime + seconds));
      audioElement.currentTime = target;
      updateProgress();
    }

    btnRewind5s.addEventListener('click', () => seekRelative(-5));
    btnForward5s.addEventListener('click', () => seekRelative(5));
    btnPcRewind.addEventListener('click', () => seekRelative(-5));
    btnPcForward.addEventListener('click', () => seekRelative(5));

    audioElement.addEventListener('loadedmetadata', () => {
      if (!state.audioDuration) {
        state.audioDuration = audioElement.duration;
        totalDurationDisplay.textContent = formatTime(state.audioDuration);
      }
    });

    audioElement.addEventListener('timeupdate', () => {
      if (!isScrubbing && !state.isCountdown) updateProgress();
    });

    audioElement.addEventListener('ended', () => {
      setPlaybackUI(false);
    });

    function updateProgress() {
      const cur = audioElement.currentTime;
      if (!state.isCountdown) {
        currentTimeDisplay.textContent = formatTime(cur);
      }

      const totalSec = getAccurateDuration();
      if (totalSec > 0) {
        const pct = (cur / totalSec) * 100;
        playhead.style.left = `${pct}%`;
      }

      const curMs = cur * 1000;
      let activeIdx = -1;
      for (let i = 0; i < state.markers.length; i++) {
        if (curMs >= state.markers[i].timeMs - 100) {
          activeIdx = i;
        } else {
          break;
        }
      }

      if (activeIdx !== state.currentMarkerIndex) {
        state.currentMarkerIndex = activeIdx;
        activeMarkerLabel.textContent = activeIdx >= 0 ? state.markers[activeIdx].label : '--';
        highlightActiveTile(activeIdx);
      }
    }

    function handleWaveformSeek(clientX) {
      const totalSec = getAccurateDuration();
      if (!totalSec) return;
      cancelCountdown();
      const rect = waveformContainer.getBoundingClientRect();
      const clickX = clientX - rect.left;
      const pct = Math.max(0, Math.min(1, clickX / rect.width));
      audioElement.currentTime = pct * totalSec;
      updateProgress();
    }

    waveformContainer.addEventListener('pointerdown', (e) => {
      isScrubbing = true;
      handleWaveformSeek(e.clientX);
    });
    window.addEventListener('pointermove', (e) => {
      if (isScrubbing) handleWaveformSeek(e.clientX);
    });
    window.addEventListener('pointerup', () => {
      isScrubbing = false;
    });

    // 助走再生を適用したマーカージャンプ
    function jumpToMarker(index) {
      if (!audioElement.src || !state.markers[index]) return;
      const targetSec = state.markers[index].timeMs / 1000;
      startPlaybackWithPrerollCheck(targetSec);
    }

    function renderPlayTiles() {
      playMarkerCount.textContent = `${state.markers.length} 個のキュー`;

      if (state.markers.length === 0) {
        emptyPlayMsg.classList.remove('hidden');
        playTilesGrid.innerHTML = '';
        playTilesGrid.appendChild(emptyPlayMsg);
        return;
      }
      emptyPlayMsg.classList.add('hidden');
      playTilesGrid.innerHTML = '';

      state.markers.forEach((m, idx) => {
        const btn = document.createElement('button');
        btn.className = `play-tile touch-press py-4 md:py-6 px-3 rounded-2xl border border-slate-800 bg-slate-900/90 text-slate-200 transition flex flex-col items-center justify-center gap-1.5 shadow-sm ${
          idx === state.currentMarkerIndex ? 'active-tile' : ''
        }`;
        btn.innerHTML = `
          <span class="text-xl md:text-3xl font-black font-mono-num leading-tight">${escapeHtml(m.label)}</span>
          <span class="text-xs md:text-sm text-slate-400 font-mono-num">${formatTimeMs(m.timeMs)}</span>
        `;
        btn.addEventListener('click', () => jumpToMarker(idx));
        playTilesGrid.appendChild(btn);
      });
    }

    function highlightActiveTile(idx) {
      const tiles = playTilesGrid.querySelectorAll('.play-tile');
      tiles.forEach((t, i) => {
        if (i === idx) {
          t.classList.add('active-tile');
        } else {
          t.classList.remove('active-tile');
        }
      });
    }

    function addMarkerAtCurrentTime() {
      if (!audioElement.src) {
        showToast('音源を読み込んでから打刻してください');
        return;
      }
      const curMs = Math.round(audioElement.currentTime * 1000);
      const defaultLabel = getNextDefaultLabel(state.nextLabelIndex);
      state.nextLabelIndex++;

      const newMarker = {
        id: 'm_' + Date.now() + '_' + Math.random().toString(36).substring(2, 5),
        label: defaultLabel,
        timeMs: curMs
      };

      state.markers.push(newMarker);
      state.markers.sort((a, b) => a.timeMs - b.timeMs);
      renderMarkerPins();
      renderPlayTiles();
      renderMarkersList();
      triggerAutoSave();
      showToast(`「${newMarker.label}」を追加`);
    }

    btnAddMarkerBtn.addEventListener('click', addMarkerAtCurrentTime);
    btnPcAddMarker.addEventListener('click', addMarkerAtCurrentTime);

    function renderMarkersList() {
      markerCountBadge.textContent = state.markers.length;

      if (state.markers.length === 0) {
        emptyMarkersMsg.classList.remove('hidden');
        markersList.innerHTML = '';
        markersList.appendChild(emptyMarkersMsg);
        return;
      }

      emptyMarkersMsg.classList.add('hidden');
      markersList.innerHTML = '';

      state.markers.forEach((marker, index) => {
        const row = document.createElement('div');
        row.className = 'rounded-xl border border-slate-800 bg-slate-900/80 p-3 flex items-center justify-between gap-3 text-xs md:text-sm shadow-sm';
        
        row.innerHTML = `
          <div class="flex items-center gap-2.5 flex-1 min-w-0">
            <span class="text-slate-500 font-mono-num text-xs w-5 text-right font-semibold">${index + 1}</span>
            <input type="text" value="${escapeHtml(marker.label)}" 
              data-id="${marker.id}"
              class="marker-label-input w-24 md:w-32 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-slate-100 font-black font-mono-num">
            <span class="font-mono-num text-cyan-400 font-bold">${formatTimeMs(marker.timeMs)}</span>
          </div>

          <div class="flex items-center gap-1.5 shrink-0">
            <button data-id="${marker.id}" data-step="-100" class="btn-nudge px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-mono-num border border-slate-700 text-xs">-0.1s</button>
            <button data-id="${marker.id}" data-step="100" class="btn-nudge px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-mono-num border border-slate-700 text-xs">+0.1s</button>
            <button data-id="${marker.id}" class="btn-play-from px-3.5 py-1 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs">再生</button>
            <button data-id="${marker.id}" class="btn-delete p-1 rounded-lg bg-slate-800 hover:bg-rose-900/60 text-slate-400 hover:text-rose-300 text-xs" title="削除">✕</button>
          </div>
        `;
        markersList.appendChild(row);
      });

      attachMarkerEvents();
    }

    function attachMarkerEvents() {
      markersList.querySelectorAll('.marker-label-input').forEach(input => {
        input.addEventListener('change', (e) => {
          const id = e.target.getAttribute('data-id');
          const m = state.markers.find(x => x.id === id);
          if (m) {
            m.label = e.target.value.trim() || 'Marker';
            renderMarkerPins();
            renderPlayTiles();
            triggerAutoSave();
          }
        });
      });

      markersList.querySelectorAll('.btn-nudge').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const step = parseInt(btn.getAttribute('data-step'), 10);
          const m = state.markers.find(x => x.id === id);
          if (m) {
            m.timeMs = Math.max(0, m.timeMs + step);
            state.markers.sort((a, b) => a.timeMs - b.timeMs);
            renderMarkersList();
            renderMarkerPins();
            renderPlayTiles();
            triggerAutoSave();
            
            startPlaybackWithPrerollCheck(m.timeMs / 1000);
          }
        });
      });

      markersList.querySelectorAll('.btn-play-from').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const m = state.markers.find(x => x.id === id);
          if (m) {
            startPlaybackWithPrerollCheck(m.timeMs / 1000);
          }
        });
      });

      markersList.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          state.markers = state.markers.filter(x => x.id !== id);
          renderMarkersList();
          renderMarkerPins();
          renderPlayTiles();
          triggerAutoSave();
        });
      });
    }

    sortMarkersBtn.addEventListener('click', () => {
      state.markers.sort((a, b) => a.timeMs - b.timeMs);
      renderMarkersList();
      renderMarkerPins();
      renderPlayTiles();
      triggerAutoSave();
      showToast('時間順に整列しました');
    });

    clearAllMarkersBtn.addEventListener('click', () => {
      if (state.markers.length === 0) return;
      state.markers = [];
      state.nextLabelIndex = 0;
      renderMarkersList();
      renderMarkerPins();
      renderPlayTiles();
      triggerAutoSave();
      showToast('全消去しました');
    });

    // ==========================================
    // JSONインポート & エクスポート
    // ==========================================
    downloadJsonBtn.addEventListener('click', () => {
      const data = {
        pieceTitle: state.audioFileName || "markers",
        audioFile: state.audioFileName || "audio",
        markers: state.markers.map(m => ({ label: m.label, timeMs: m.timeMs }))
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${state.audioFileName || 'markers'}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('JSONをエクスポートしました');
    });

    jsonFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          if (Array.isArray(data.markers)) {
            state.markers = data.markers.map((m, idx) => ({
              id: 'm_' + idx + '_' + Date.now(),
              label: m.label || `Marker ${idx + 1}`,
              timeMs: typeof m.timeMs === 'number' ? m.timeMs : 0
            }));
            state.markers.sort((a, b) => a.timeMs - b.timeMs);
            state.nextLabelIndex = state.markers.length;
          }
          renderMarkersList();
          renderMarkerPins();
          renderPlayTiles();
          triggerAutoSave();
          showToast('JSONをインポートしました');
        } catch (err) {
          showToast('JSON読み込み失敗');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    // ショートカット
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      if (e.code === 'Space') {
        e.preventDefault();
        togglePlayPause();
      } else if (e.code === 'KeyM') {
        e.preventDefault();
        addMarkerAtCurrentTime();
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        seekRelative(-5);
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        seekRelative(5);
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // 起動時: 最後に開いていたプロジェクトを自動復元
    window.addEventListener('DOMContentLoaded', async () => {
      updatePrerollUI();
      loadSavedProjectsList();
      const lastId = localStorage.getItem(LAST_OPENED_KEY);
      if (lastId) {
        await loadProjectFromDB(lastId);
      }
    });
  </script>
</body>
</html>
