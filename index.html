<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cue Web App - Audio Marker Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top, 0px);
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    .touch-press:active {
      transform: scale(0.96);
      transition: transform 0.08s ease;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-cyan-500 selection:text-slate-950 pb-24 md:pb-6">

  <!-- ヘッダー -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-40 px-4 sm:px-6 py-2.5 pt-safe flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-lg bg-cyan-600 flex items-center justify-center font-bold text-white text-base shadow-sm">
        C
      </div>
      <div>
        <h1 class="text-sm font-bold text-white tracking-tight leading-none">cueWebApp</h1>
        <p class="text-[11px] text-slate-400 mt-0.5">楽曲キュー / マーカー設定ツール</p>
      </div>
    </div>

    <!-- JSON操作ボタン群 -->
    <div class="flex items-center gap-2">
      <label class="cursor-pointer text-xs px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 border border-slate-700 transition flex items-center gap-1.5" title="JSONインポート">
        <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
        </svg>
        <span>インポート</span>
        <input type="file" id="jsonFileInput" accept=".json" class="hidden">
      </label>

      <button id="downloadJsonBtn" class="text-xs px-2.5 py-1.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 active:scale-95 text-white font-medium transition flex items-center gap-1.5 shadow-sm">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        <span>エクスポート</span>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-3 sm:p-5 flex flex-col gap-4">

    <!-- 音源ロード / ファイルバー -->
    <div id="dropZone" class="relative rounded-xl border border-dashed border-slate-700 hover:border-cyan-500 bg-slate-900/60 p-3 transition cursor-pointer">
      <input type="file" id="audioFileInput" accept="audio/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
      
      <div id="uploadPrompt" class="flex items-center justify-center gap-2 py-1 text-center">
        <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
        </svg>
        <span class="text-xs font-semibold text-slate-300">音源ファイルを選択 または ドラッグ＆ドロップ (MP3 / WAV / M4A)</span>
      </div>

      <div id="fileLoadedInfo" class="hidden flex items-center justify-between">
        <div class="flex items-center gap-2 min-w-0">
          <span class="w-2 h-2 rounded-full bg-cyan-400"></span>
          <p id="loadedFileName" class="text-xs font-semibold text-slate-200 truncate font-mono-num">audio.mp3</p>
        </div>
        <button id="changeFileBtn" class="text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 relative z-20 border border-slate-700">ファイル変更</button>
      </div>
    </div>

    <!-- プレイヤー & 波形表示 -->
    <div class="rounded-xl border border-slate-800 bg-slate-900/90 p-4 shadow-sm flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-[10px] uppercase font-bold text-slate-400 px-1.5 py-0.5 rounded bg-slate-950 border border-slate-800">CUE</span>
          <span id="activeMarkerLabel" class="text-base font-bold text-cyan-400 font-mono-num">--</span>
        </div>
        <div class="flex items-baseline gap-1.5 font-mono-num">
          <span id="currentTimeDisplay" class="text-2xl font-bold tracking-tight text-white">00:00.000</span>
          <span class="text-slate-600 text-xs">/</span>
          <span id="totalDurationDisplay" class="text-xs text-slate-400">00:00.000</span>
        </div>
      </div>

      <!-- 波形 & 再生位置 (シーク可能) -->
      <div class="relative w-full h-16 bg-slate-950 rounded-lg overflow-hidden border border-slate-800 cursor-pointer select-none touch-none" id="waveformContainer">
        <canvas id="waveformCanvas" class="w-full h-full block"></canvas>
        <div id="playhead" class="absolute top-0 bottom-0 w-0.5 bg-cyan-400 pointer-events-none z-20 shadow-[0_0_6px_#22d3ee]" style="left: 0%;"></div>
        <div id="markerPinsOverlay" class="absolute inset-0 pointer-events-none z-10"></div>
      </div>
    </div>

    <!-- マーカー管理セクション -->
    <div class="rounded-xl border border-slate-800 bg-slate-900/90 p-4 shadow-sm flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300">マーカーリスト</h2>
          <span id="markerCountBadge" class="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-800 text-cyan-300 font-mono-num border border-slate-700">0</span>
        </div>
        <div class="flex items-center gap-2">
          <button id="sortMarkersBtn" class="touch-press text-xs px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 font-medium transition">
            整列
          </button>
          <button id="clearAllMarkersBtn" class="touch-press text-xs px-2.5 py-1 rounded-lg bg-rose-950/40 hover:bg-rose-900/50 text-rose-300 border border-rose-800/40 font-medium transition">
            全消去
          </button>
        </div>
      </div>

      <!-- リスト -->
      <div id="markersList" class="flex flex-col gap-2 min-h-[160px]">
        <div id="emptyMarkersMsg" class="py-12 px-4 rounded-lg border border-dashed border-slate-800/80 bg-slate-950/40 text-center text-slate-500 text-xs flex flex-col items-center justify-center gap-1.5">
          <p>マーカーはまだありません</p>
          <p class="text-[11px] text-slate-600">再生しながら [マーカー追加] ボタン、またはキーボードの [M] キーで打刻できます。</p>
        </div>
      </div>
    </div>

  </main>

  <!-- 画面下部 固定コントローラー -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-4 py-2.5 pb-safe shadow-lg">
    <div class="max-w-md mx-auto flex items-center gap-2">
      <!-- 5秒戻る -->
      <button id="btnRewind5s" class="touch-press w-12 h-12 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 flex items-center justify-center shrink-0" title="5秒戻る (←)">
        <span class="text-xs font-mono-num font-bold">-5s</span>
      </button>

      <!-- 再生 / 一時停止 -->
      <button id="btnPlayPause" class="touch-press w-14 h-12 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 flex items-center justify-center shrink-0 shadow-md font-bold">
        <svg id="playIcon" class="w-6 h-6 fill-current" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z" />
        </svg>
        <svg id="pauseIcon" class="w-6 h-6 fill-current hidden" viewBox="0 0 24 24">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
        </svg>
      </button>

      <!-- 5秒進む -->
      <button id="btnForward5s" class="touch-press w-12 h-12 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 flex items-center justify-center shrink-0" title="5秒進む (→)">
        <span class="text-xs font-mono-num font-bold">+5s</span>
      </button>

      <!-- マーカー打刻 -->
      <button id="btnAddMarkerBtn" class="touch-press flex-1 h-12 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold flex items-center justify-center gap-2 px-3 shadow-md">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
        </svg>
        <span class="text-xs font-bold tracking-wide">マーカー追加 (M)</span>
      </button>
    </div>
  </nav>

  <!-- トースト通知 -->
  <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 bg-slate-800/95 text-cyan-300 border border-cyan-500/40 px-3.5 py-1.5 rounded-lg shadow-lg opacity-0 pointer-events-none transition duration-150 z-50 text-xs font-medium">
    <span id="toastMsg">通知</span>
  </div>

  <audio id="audioElement" preload="metadata"></audio>

  <script>
    const state = {
      audioBuffer: null,
      audioDuration: 0,
      audioFileName: 'audio',
      markers: [],
      nextLabelIndex: 0
    };

    let audioCtx = null;
    let isScrubbing = false;

    const audioElement = document.getElementById('audioElement');
    const audioFileInput = document.getElementById('audioFileInput');
    const dropZone = document.getElementById('dropZone');
    const uploadPrompt = document.getElementById('uploadPrompt');
    const fileLoadedInfo = document.getElementById('fileLoadedInfo');
    const loadedFileName = document.getElementById('loadedFileName');
    const changeFileBtn = document.getElementById('changeFileBtn');

    const currentTimeDisplay = document.getElementById('currentTimeDisplay');
    const totalDurationDisplay = document.getElementById('totalDurationDisplay');
    const activeMarkerLabel = document.getElementById('activeMarkerLabel');
    const markerCountBadge = document.getElementById('markerCountBadge');

    const waveformCanvas = document.getElementById('waveformCanvas');
    const waveformContainer = document.getElementById('waveformContainer');
    const playhead = document.getElementById('playhead');
    const markerPinsOverlay = document.getElementById('markerPinsOverlay');

    const btnPlayPause = document.getElementById('btnPlayPause');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const btnRewind5s = document.getElementById('btnRewind5s');
    const btnForward5s = document.getElementById('btnForward5s');
    const btnAddMarkerBtn = document.getElementById('btnAddMarkerBtn');

    const markersList = document.getElementById('markersList');
    const emptyMarkersMsg = document.getElementById('emptyMarkersMsg');
    const sortMarkersBtn = document.getElementById('sortMarkersBtn');
    const clearAllMarkersBtn = document.getElementById('clearAllMarkersBtn');

    const downloadJsonBtn = document.getElementById('downloadJsonBtn');
    const jsonFileInput = document.getElementById('jsonFileInput');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) seconds = 0;
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      const ms = Math.floor((seconds % 1) * 1000);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(ms).padStart(3, '0')}`;
    }

    function formatTimeMs(ms) {
      return formatTime(ms / 1000);
    }

    function showToast(text) {
      toastMsg.textContent = text;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 1500);
    }

    function getNextDefaultLabel(index) {
      if (index === 0) return 'Intro';
      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const letterIdx = index - 1;
      if (letterIdx < letters.length) return letters[letterIdx];
      return letters[letterIdx % 26] + Math.floor(letterIdx / 26);
    }

    async function loadAudioFile(file) {
      if (!file) return;
      state.audioFileName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
      loadedFileName.textContent = file.name;
      
      uploadPrompt.classList.add('hidden');
      fileLoadedInfo.classList.remove('hidden');

      audioElement.src = URL.createObjectURL(file);

      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }
        const arrayBuffer = await file.arrayBuffer();
        state.audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        state.audioDuration = state.audioBuffer.duration;
        totalDurationDisplay.textContent = formatTime(state.audioDuration);
        drawWaveform();
        showToast('音源を読み込みました');
      } catch (err) {
        console.warn('波形描画エラー:', err);
      }
    }

    audioFileInput.addEventListener('change', (e) => {
      if (e.target.files[0]) loadAudioFile(e.target.files[0]);
    });

    changeFileBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      audioFileInput.click();
    });

    ['dragenter', 'dragover'].forEach(ev => {
      dropZone.addEventListener(ev, (e) => {
        e.preventDefault();
        dropZone.classList.add('border-cyan-400');
      });
    });
    ['dragleave', 'drop'].forEach(ev => {
      dropZone.addEventListener(ev, (e) => {
        e.preventDefault();
        dropZone.classList.remove('border-cyan-400');
      });
    });
    dropZone.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('audio/')) loadAudioFile(file);
    });

    function drawWaveform() {
      if (!state.audioBuffer) return;
      const dpr = window.devicePixelRatio || 1;
      const rect = waveformContainer.getBoundingClientRect();
      if (rect.width === 0) return;

      waveformCanvas.width = rect.width * dpr;
      waveformCanvas.height = rect.height * dpr;

      const ctx = waveformCanvas.getContext('2d');
      ctx.scale(dpr, dpr);

      const width = rect.width;
      const height = rect.height;
      const data = state.audioBuffer.getChannelData(0);
      const step = Math.ceil(data.length / width);
      const amp = height / 2;

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#0284c7';

      for (let i = 0; i < width; i++) {
        let min = 1.0;
        let max = -1.0;
        for (let j = 0; j < step; j++) {
          const val = data[(i * step) + j];
          if (val < min) min = val;
          if (val > max) max = val;
        }
        ctx.fillRect(i, (1 + min) * amp, 1, Math.max(1, (max - min) * amp));
      }
      renderMarkerPins();
    }

    window.addEventListener('resize', () => {
      if (state.audioBuffer) drawWaveform();
    });

    function renderMarkerPins() {
      markerPinsOverlay.innerHTML = '';
      if (!state.audioDuration) return;

      state.markers.forEach(m => {
        const pct = (m.timeMs / 1000 / state.audioDuration) * 100;
        if (pct < 0 || pct > 100) return;

        const pin = document.createElement('div');
        pin.className = 'absolute top-0 bottom-0 flex flex-col items-center pointer-events-none';
        pin.style.left = `${pct}%`;
        pin.innerHTML = `
          <div class="px-1 py-0.2 rounded bg-amber-500 text-slate-950 font-bold text-[9px] transform -translate-x-1/2 shadow font-mono-num whitespace-nowrap">
            ${escapeHtml(m.label)}
          </div>
          <div class="w-px h-full bg-amber-400/80"></div>
        `;
        markerPinsOverlay.appendChild(pin);
      });
    }

    function setPlaybackUI(isPlaying) {
      if (isPlaying) {
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
      } else {
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
      }
    }

    function togglePlayPause() {
      if (!audioElement.src) {
        showToast('音源を選択してください');
        return;
      }
      if (audioElement.paused) {
        audioElement.play().then(() => setPlaybackUI(true)).catch(err => console.warn(err));
      } else {
        audioElement.pause();
        setPlaybackUI(false);
      }
    }

    btnPlayPause.addEventListener('click', togglePlayPause);

    function seekRelative(seconds) {
      if (!audioElement.src) return;
      const target = Math.max(0, Math.min(audioElement.duration || 0, audioElement.currentTime + seconds));
      audioElement.currentTime = target;
      updateProgress();
    }

    btnRewind5s.addEventListener('click', () => seekRelative(-5));
    btnForward5s.addEventListener('click', () => seekRelative(5));

    audioElement.addEventListener('loadedmetadata', () => {
      state.audioDuration = audioElement.duration;
      totalDurationDisplay.textContent = formatTime(state.audioDuration);
    });

    audioElement.addEventListener('timeupdate', () => {
      if (!isScrubbing) updateProgress();
    });

    audioElement.addEventListener('ended', () => {
      setPlaybackUI(false);
    });

    function updateProgress() {
      const cur = audioElement.currentTime;
      currentTimeDisplay.textContent = formatTime(cur);

      if (state.audioDuration > 0) {
        const pct = (cur / state.audioDuration) * 100;
        playhead.style.left = `${pct}%`;
      }

      // 現在のマーカー特定
      const curMs = cur * 1000;
      let curLabel = '--';
      for (let i = 0; i < state.markers.length; i++) {
        if (curMs >= state.markers[i].timeMs - 150) {
          curLabel = state.markers[i].label;
        } else {
          break;
        }
      }
      activeMarkerLabel.textContent = curLabel;
    }

    function handleWaveformSeek(clientX) {
      if (!state.audioDuration) return;
      const rect = waveformContainer.getBoundingClientRect();
      const clickX = clientX - rect.left;
      const pct = Math.max(0, Math.min(1, clickX / rect.width));
      audioElement.currentTime = pct * state.audioDuration;
      updateProgress();
    }

    waveformContainer.addEventListener('pointerdown', (e) => {
      isScrubbing = true;
      handleWaveformSeek(e.clientX);
    });
    window.addEventListener('pointermove', (e) => {
      if (isScrubbing) handleWaveformSeek(e.clientX);
    });
    window.addEventListener('pointerup', () => {
      isScrubbing = false;
    });

    function addMarkerAtCurrentTime() {
      if (!audioElement.src) {
        showToast('音源を読み込んでから打刻してください');
        return;
      }
      const curMs = Math.round(audioElement.currentTime * 1000);
      const defaultLabel = getNextDefaultLabel(state.nextLabelIndex);
      state.nextLabelIndex++;

      const newMarker = {
        id: 'm_' + Date.now() + '_' + Math.random().toString(36).substring(2, 5),
        label: defaultLabel,
        timeMs: curMs
      };

      state.markers.push(newMarker);
      state.markers.sort((a, b) => a.timeMs - b.timeMs);
      renderMarkersList();
      renderMarkerPins();
      showToast(`マーク「${newMarker.label}」を追加`);
    }

    btnAddMarkerBtn.addEventListener('click', addMarkerAtCurrentTime);

    function renderMarkersList() {
      markerCountBadge.textContent = state.markers.length;

      if (state.markers.length === 0) {
        emptyMarkersMsg.classList.remove('hidden');
        markersList.innerHTML = '';
        markersList.appendChild(emptyMarkersMsg);
        return;
      }

      emptyMarkersMsg.classList.add('hidden');
      markersList.innerHTML = '';

      state.markers.forEach((marker, index) => {
        const item = document.createElement('div');
        item.className = 'rounded-lg border border-slate-800 bg-slate-950/60 p-2.5 flex items-center justify-between gap-3 text-xs';
        
        item.innerHTML = `
          <div class="flex items-center gap-2 flex-1 min-w-0">
            <span class="text-slate-500 font-mono-num text-[11px] w-5 text-right font-semibold">${index + 1}</span>
            <input type="text" value="${escapeHtml(marker.label)}" 
              data-id="${marker.id}"
              class="marker-label-input w-28 bg-slate-900 border border-slate-700/80 focus:border-cyan-400 focus:outline-none rounded px-2 py-1 text-slate-100 font-bold font-mono-num transition">
            <span class="font-mono-num text-cyan-300 font-bold text-xs">${formatTimeMs(marker.timeMs)}</span>
          </div>

          <div class="flex items-center gap-1.5 shrink-0">
            <button data-id="${marker.id}" data-step="-100" class="btn-nudge px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 font-mono-num border border-slate-700">
              -0.1s
            </button>
            <button data-id="${marker.id}" data-step="100" class="btn-nudge px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 font-mono-num border border-slate-700">
              +0.1s
            </button>
            <button data-id="${marker.id}" class="btn-play-from px-2.5 py-1 rounded bg-cyan-600 hover:bg-cyan-500 text-white font-bold transition flex items-center gap-1">
              再生
            </button>
            <button data-id="${marker.id}" class="btn-delete p-1 rounded bg-slate-800 hover:bg-rose-900/50 text-slate-400 hover:text-rose-300 transition" title="削除">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>
        `;
        markersList.appendChild(item);
      });

      attachMarkerEvents();
    }

    function attachMarkerEvents() {
      markersList.querySelectorAll('.marker-label-input').forEach(input => {
        input.addEventListener('change', (e) => {
          const id = e.target.getAttribute('data-id');
          const m = state.markers.find(x => x.id === id);
          if (m) {
            m.label = e.target.value.trim() || 'Marker';
            renderMarkerPins();
          }
        });
      });

      markersList.querySelectorAll('.btn-nudge').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const step = parseInt(btn.getAttribute('data-step'), 10);
          const m = state.markers.find(x => x.id === id);
          if (m) {
            m.timeMs = Math.max(0, m.timeMs + step);
            state.markers.sort((a, b) => a.timeMs - b.timeMs);
            renderMarkersList();
            renderMarkerPins();
            if (audioElement.src) {
              audioElement.currentTime = m.timeMs / 1000;
              audioElement.play().then(() => setPlaybackUI(true));
              updateProgress();
            }
          }
        });
      });

      markersList.querySelectorAll('.btn-play-from').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const m = state.markers.find(x => x.id === id);
          if (m && audioElement.src) {
            audioElement.currentTime = m.timeMs / 1000;
            audioElement.play().then(() => setPlaybackUI(true));
            updateProgress();
          }
        });
      });

      markersList.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          state.markers = state.markers.filter(x => x.id !== id);
          renderMarkersList();
          renderMarkerPins();
        });
      });
    }

    sortMarkersBtn.addEventListener('click', () => {
      state.markers.sort((a, b) => a.timeMs - b.timeMs);
      renderMarkersList();
      renderMarkerPins();
      showToast('時間順に並べ替えました');
    });

    clearAllMarkersBtn.addEventListener('click', () => {
      if (state.markers.length === 0) return;
      state.markers = [];
      state.nextLabelIndex = 0;
      renderMarkersList();
      renderMarkerPins();
      showToast('マーカーを全消去しました');
    });

    // JSON入出力
    downloadJsonBtn.addEventListener('click', () => {
      const data = {
        pieceTitle: state.audioFileName || "markers",
        audioFile: state.audioFileName || "audio",
        markers: state.markers.map(m => ({ label: m.label, timeMs: m.timeMs }))
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${state.audioFileName}_markers.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('JSONを保存しました');
    });

    jsonFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          if (Array.isArray(data.markers)) {
            state.markers = data.markers.map((m, idx) => ({
              id: 'm_' + idx + '_' + Date.now(),
              label: m.label || `Marker ${idx + 1}`,
              timeMs: typeof m.timeMs === 'number' ? m.timeMs : 0
            }));
            state.markers.sort((a, b) => a.timeMs - b.timeMs);
            state.nextLabelIndex = state.markers.length;
          }
          renderMarkersList();
          renderMarkerPins();
          showToast('JSONをインポートしました');
        } catch (err) {
          showToast('JSONの読み込みに失敗しました');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    // キーボードショートカット (Space: 再生/停止, M: 打刻, ←/→: 5秒シーク)
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      if (e.code === 'Space') {
        e.preventDefault();
        togglePlayPause();
      } else if (e.code === 'KeyM') {
        e.preventDefault();
        addMarkerAtCurrentTime();
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        seekRelative(-5);
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        seekRelative(5);
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
